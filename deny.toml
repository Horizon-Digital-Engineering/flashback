# cargo-deny config. Schema docs: https://embarkstudios.github.io/cargo-deny/
#
# `cargo deny check` runs locally; CI runs `cargo deny check --all-features`
# via .github/workflows/security.yml. Tighten as findings surface; this is a
# pragmatic baseline, not a final policy.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# RUSTSEC advisories we accept (with reason). Each entry should be revisited
# whenever the offending dep updates — `cargo update -p <crate>` and remove
# the ignore.
ignore = [
    # RSA Marvin Attack — timing sidechannel in `rsa 0.9.10`. Pulled in via
    # sqlx-postgres for md5 auth fallback. NO upstream patch yet (rust-rsa is
    # rewriting to constant-time). The attack requires network-observable
    # timing on a host that processes adversary-controlled RSA operations.
    # Flashback's `rsa` use is solely for postgres protocol auth on a local
    # connection; the timing isn't network-observable in the tailnet /
    # localhost deploy model. Revisit when sqlx ships a patched release.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin: transitive via sqlx-postgres md5 auth; no upstream patch; not exploitable in tailnet/localhost deploy" },

    # `rand 0.8.5` unsound under a very specific combination: custom logger
    # AND `log` + `thread_rng` features AND trace-level logging AND specific
    # call patterns. Flashback uses `tracing` (not `log`) and doesn't define
    # a custom logger. Transitive via sqlx-postgres / nalgebra / rand_distr.
    { id = "RUSTSEC-2026-0097", reason = "rand 0.8.5 unsound only under custom-logger + thread_rng combo; flashback uses tracing, not log, and no custom logger" },

    # Unmaintained crates pulled in transitively. None has a security flaw;
    # they're flagged for "author archived the repo." Recommended replacements
    # noted but waiting on upstream deps to adopt them.
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; transitive; recommended swap rustc-hash awaiting upstream" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained; transitive; recommended swap unit-prefix awaiting upstream" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via mistralrs; recommended swap pastey awaiting upstream" },
]

[licenses]
version = 2
# Allowlist. Add to this list deliberately — never default-allow a new license.
# Common Rust-ecosystem licenses (matches what 95% of crates use). All
# permissive or weak-copyleft (MPL-2.0); no GPL/AGPL/LGPL allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",   # recvmsg (interprocess → mistralrs-core); even more permissive than MIT
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",   # libfuzzer-sys (image → fastembed); OSI/FSF approved, MIT-equivalent
    "BUSL-1.1",  # this project's own license; needed so cargo-deny accepts flashback's workspace crates
]
confidence-threshold = 0.93
# Per-crate license overrides — only for crates whose declared license
# can't be auto-detected. Keep this list short and reviewed.
exceptions = []

[[licenses.clarify]]
# The `ring` crate's license is a fused mix (ISC + MIT + OpenSSL) that
# cargo-deny can't auto-detect. This clarification matches the upstream
# guidance from briansmith/ring.
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
# ML stack (mistralrs, tokenizers, fastembed) pulls overlapping versions of
# several deps (e.g. tokenizers 0.21.x and 0.22.x). De-duplicating would
# require pinning upstream crates we don't control. Leaving as warn so we
# see the report in CI but it doesn't block.
multiple-versions = "warn"
# Wildcards in transitive deps would block; relaxed to warn to surface them
# without failing CI. Tighten back to "deny" once we've audited and pinned
# any wildcard requirements.
wildcards = "warn"
highlight = "all"
# Crates we explicitly never want pulled in.
deny = []
# Versions we allow even when `multiple-versions` would fire.
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only crates.io. Add internal mirrors here if/when we have any.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
