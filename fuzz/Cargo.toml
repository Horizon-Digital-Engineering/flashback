[package]
name = "flashback-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.flashback-nlp]
path = "../crates/nlp"

[[bin]]
name = "parse_extraction"
path = "fuzz_targets/parse_extraction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_distill"
path = "fuzz_targets/parse_distill.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strip_fences"
path = "fuzz_targets/strip_fences.rs"
test = false
doc = false
bench = false

# Its own workspace: the fuzz targets build on nightly with a sanitizer, and
# folding them into the main workspace would drag that toolchain into every
# ordinary `cargo build`.
[workspace]
