name: Security
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly Sunday 06:00 UTC — catches new advisories in deps that haven't changed.
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write   # post the review comment summarizing diff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # License policy lives in deny.toml (cargo deps) — not duplicated
          # here. The action's allow-licenses applies to ALL ecosystems incl.
          # github-actions, but those are runtime JS (not linked into our
          # binary) where copyleft licenses don't propagate. Mirroring our
          # cargo allowlist here would force-reject e.g. Swatinem/rust-cache
          # (LGPL-3.0) which is harmless in this context. Instead, deny only
          # the licenses we'd never accept anywhere. Every entry must be a
          # valid SPDX identifier — the action rejects non-SPDX tokens (e.g.
          # the Commons Clause rider, which only ever appears fused onto a
          # real license and is caught by that license instead).
          deny-licenses: GPL-3.0, GPL-3.0-or-later, AGPL-3.0, AGPL-3.0-or-later, SSPL-1.0
          # The secret scanner is AGPL, which the deny list above would flag
          # whenever its pin changes. It runs only in CI and links nothing into
          # the shipped binary, so its copyleft never reaches us — exempt it
          # from the license check (vulnerability checks still apply).
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog
          comment-summary-in-pr: on-failure

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          set -eo pipefail
          VERSION=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint -version
      - run: actionlint -color

  secrets-trufflehog:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified

  secrets-gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -eo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks detect
        run: |
          set -eo pipefail
          echo "## Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          if gitleaks detect --source . --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif; then
            echo "OK no secrets found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL gitleaks found leaks (see job log; sarif uploaded as artifact)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  # NB: a standalone cargo-audit (rustsec/audit-check) job lived here briefly.
  # Removed because `cargo deny check advisories` already runs against the same
  # RustSec advisory DB, with the ignore-list policy expressed once in
  # deny.toml. Keeping both forced double-maintenance of the ignore list and
  # the rustsec/audit-check action has no native ignore-list support.

  cargo-deny:
    name: License + supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # post-v2.0.19, pins cargo-deny 0.19.7
        with:
          command: check
          arguments: --all-features

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.163.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep scan
        run: |
          set -eo pipefail
          if semgrep scan --config auto --error --exclude target --exclude node_modules 2>&1 | tee semgrep.txt; then
            {
              echo "## Semgrep SAST"
              echo "OK no findings"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Semgrep SAST"
              echo "FAIL findings:"
              echo '```'
              cat semgrep.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
