name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NB: not setting `RUSTFLAGS: -D warnings` here. The codebase ships with
  # known dead-code findings that the maintainer is fine with for now;
  # we want CI to surface warnings (visible in run logs + as annotations)
  # without blocking merges. Tighten this when the warning backlog is
  # addressed.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # post-v2.9.1
      # NB: not passing `-- -D warnings` to clippy. Same rationale as the
      # RUSTFLAGS comment above — surface style findings as annotations,
      # don't block merges on them. Tighten when the lint backlog is clean.
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    # pgvector-enabled Postgres so #[sqlx::test] integration tests can run
    # against the real DB (matches what flashback uses in production).
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: flashback
          POSTGRES_USER: flashback
          POSTGRES_PASSWORD: flashback
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flashback"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgres://flashback:flashback@localhost:5432/flashback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # post-v2.9.1
      - run: cargo test --workspace --all-features

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # post-v2.9.1
      - run: cargo build --workspace --release --all-features
