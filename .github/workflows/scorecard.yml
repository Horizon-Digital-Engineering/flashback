name: OpenSSF Scorecard
on:
  # Recomputes on protection rule changes (so a tightened ruleset bumps the score).
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 0'  # weekly Sunday 06:17 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to Code Scanning
      id-token: write          # publish results signed via OIDC
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run analysis
        # NB: pinned to tag (not SHA) because the scorecard webapp's workflow
        # verification rejects SHA-pinned uses with "imposter commit" — see
        # https://github.com/ossf/scorecard-action#workflow-restrictions
        # The SARIF upload step below still pins by SHA so this is the only
        # exception in the workflow.
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score publicly at https://api.securityscorecards.dev/projects/github.com/Horizon-Digital-Engineering/flashback
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: results.sarif
