name: Release

# Tag-triggered binary releases: build the workspace for each supported
# target, attach tarballs + checksums to a draft release, then publish.
# Publishing fires the `release: published` trigger, so sbom.yml attaches
# SBOMs + provenance + cosign signatures to the same release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag names the release; Cargo.toml names what the binaries report about
  # themselves through CARGO_PKG_VERSION — /health, the MCP handshake, the
  # doctor. Nothing tied the two together, so tagging without bumping shipped
  # a release called one thing containing binaries that answer another, and
  # nothing anywhere would have said so. Fail here instead, before a draft
  # release exists to clean up.
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag against the workspace version
        run: |
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=$tag_version cargo=$cargo_version"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version — bump the workspace version and re-tag" >&2
            exit 1
          fi

  create-release:
    name: Create draft release
    needs: check-version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                 --title "flashback $GITHUB_REF_NAME" \
                 --notes "Binaries for macOS (Apple Silicon), Linux (x86_64 / aarch64), and Windows (experimental). Each tarball bundles flashback, flashback-mcp, flashback-nlp-prefetch, migrations, and the launchd/systemd deploy templates — see DEPLOY.md for install paths. Verify checksums with: openssl dgst -sha256 -r <file>."

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    # Windows is experimental: not yet exercised in CI, so a failure there
    # must not block the release.
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon runner
            target: aarch64-apple-darwin
            experimental: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            experimental: false
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            experimental: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # post-v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        # TARGET comes through env, not inline expansion: shellcheck can reason
        # about a real variable (SC2193), and the matrix value never lands in
        # the script text.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=".exe"
          stage="flashback-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$stage/deploy"
          cp "target/${TARGET}/release/flashback${ext}" \
             "target/${TARGET}/release/flashback-mcp${ext}" \
             "target/${TARGET}/release/flashback-nlp-prefetch${ext}" \
             "$stage/"
          cp -R migrations LICENSE README.md DEPLOY.md "$stage/"
          cp -R deploy/macos deploy/systemd "$stage/deploy/"
          tar czf "${stage}.tar.gz" "$stage"
          openssl dgst -sha256 -r "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            flashback-*.tar.gz flashback-*.tar.gz.sha256 --clobber

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flip the draft live
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
