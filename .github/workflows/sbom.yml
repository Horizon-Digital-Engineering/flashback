name: SBOM
on:
  # Called by release.yml. The `release: published` event never arrived —
  # GITHUB_TOKEN publishes it, and its events do not start workflows.
  workflow_call:
    inputs:
      tag:
        description: The release tag to attach to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach to
        required: true
        type: string

# Default-deny at the top level so the workflow can't accidentally use
# a write-scoped token outside the one job that needs it. Scorecard's
# Token-Permissions check requires this even when there's only one job.
permissions:
  contents: read

jobs:
  sbom:
    name: Generate + attach SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach SBOM + signatures to the release
      id-token: write       # OIDC token for cosign keyless + SLSA attestation
      attestations: write   # write the attestation to the repo
    env:
      # Hoisted out of `run:` interpolation per semgrep's
      # github-actions.security.run-shell-injection rule: github.* context
      # data should land in env first, then be referenced as "$VAR" inside the
      # script so it can't be parsed as shell.
      REF_NAME: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # syft natively understands Cargo.lock and emits CycloneDX + SPDX
      # from a single binary; faster than `cargo cyclonedx` (no compile).
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          format: cyclonedx-json
          artifact-name: flashback-${{ inputs.tag }}-sbom.cdx.json
          output-file: flashback-${{ inputs.tag }}-sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          format: spdx-json
          artifact-name: flashback-${{ inputs.tag }}-sbom.spdx.json
          output-file: flashback-${{ inputs.tag }}-sbom.spdx.json

      # SLSA build provenance — a signed statement that "this SBOM file
      # was produced by this workflow at this commit." Anyone consuming
      # flashback's release artifacts can verify the attestation chain with
      # `gh attestation verify <file> --owner Horizon-Digital-Engineering`.
      # Closes the supply-chain gap where an attacker swaps the SBOM for
      # a stale / lying one.
      - name: Attest SBOM build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: 'flashback-*-sbom.*.json'

      # Copy the attestation bundle (.intoto.jsonl) next to the SBOMs so
      # we can ship it as a release asset. The default attestation path
      # is `${{ steps.attest.outputs.bundle-path }}` (a GH-temp path).
      # Scorecard's Signed-Releases check pattern-matches `.intoto.jsonl`
      # next to release artifacts — uploading the bundle here is what
      # flips its "has provenance" sub-check from 0 to credit.
      - name: Stage attestation bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eo pipefail
          cp "$BUNDLE_PATH" "flashback-${REF_NAME}-provenance.intoto.jsonl"
          ls -la flashback-*

      # Keyless: the signing identity is this workflow's OIDC token. Verify:
      #   cosign verify-blob \
      #     --certificate-identity-regexp "^https://github.com/Horizon-Digital-Engineering/flashback/" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --bundle <file>.sigstore.json <file>
      # One bundle holds signature and certificate. The old --output-signature
      # and --output-certificate are ignored by current cosign, which then
      # dies on the bundle path it was never given.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOMs with cosign (keyless)
        run: |
          set -eo pipefail
          for f in flashback-*-sbom.*.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          ls -la flashback-*-sbom.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            flashback-*-sbom.cdx.json
            flashback-*-sbom.spdx.json
            flashback-*-sbom.*.json.sigstore.json
            flashback-*-provenance.intoto.jsonl

      # No event gate: repairing a release by hand is the only reason to run
      # this manually, and the gate made exactly that impossible.
      - name: Attach SBOMs + signatures + provenance to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$REF_NAME" \
            flashback-*-sbom.cdx.json flashback-*-sbom.spdx.json \
            flashback-*-sbom.*.json.sigstore.json \
            flashback-*-provenance.intoto.jsonl \
            --clobber
