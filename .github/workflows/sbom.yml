name: SBOM
on:
  release:
    types: [published]
  workflow_dispatch:

# Default-deny at the top level so the workflow can't accidentally use
# a write-scoped token outside the one job that needs it. Scorecard's
# Token-Permissions check requires this even when there's only one job.
permissions:
  contents: read

jobs:
  sbom:
    name: Generate + attach SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach SBOM + signatures to the release
      id-token: write       # OIDC token for cosign keyless + SLSA attestation
      attestations: write   # write the attestation to the repo
    env:
      # Hoisted out of `run:` interpolation per semgrep's
      # github-actions.security.run-shell-injection rule: github.* context
      # data should land in env first, then be referenced as "$VAR" inside the
      # script so it can't be parsed as shell.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # syft natively understands Cargo.lock and emits CycloneDX + SPDX
      # from a single binary; faster than `cargo cyclonedx` (no compile).
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: flashback-${{ github.ref_name }}-sbom.cdx.json
          output-file: flashback-${{ github.ref_name }}-sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          artifact-name: flashback-${{ github.ref_name }}-sbom.spdx.json
          output-file: flashback-${{ github.ref_name }}-sbom.spdx.json

      # SLSA build provenance — a signed statement that "this SBOM file
      # was produced by this workflow at this commit." Anyone consuming
      # flashback's release artifacts can verify the attestation chain with
      # `gh attestation verify <file> --owner Horizon-Digital-Engineering`.
      # Closes the supply-chain gap where an attacker swaps the SBOM for
      # a stale / lying one.
      - name: Attest SBOM build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v3.0.0
        with:
          subject-path: 'flashback-*-sbom.*.json'

      # Sigstore keyless cosign signing. No private key — the signing
      # identity IS this workflow's OIDC token (issuer:
      # https://token.actions.githubusercontent.com, subject:
      # this repo + ref + workflow path). Fulcio mints a 10-min
      # cert tied to that identity; Rekor logs the signing event to
      # the public transparency log. Anyone verifying:
      #   cosign verify-blob \
      #     --certificate-identity-regexp "^https://github.com/Horizon-Digital-Engineering/flashback/" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --signature <file>.sig --certificate <file>.pem <file>
      # Scorecard's Signed-Releases check pattern-matches on the
      # `.sig` extension next to release assets.
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign SBOMs with cosign (keyless)
        run: |
          set -eo pipefail
          for f in flashback-*-sbom.*.json; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la flashback-*-sbom.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            flashback-*-sbom.*.json
            flashback-*-sbom.*.json.sig
            flashback-*-sbom.*.json.pem

      - name: Attach SBOMs + signatures to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$REF_NAME" \
            flashback-*-sbom.*.json \
            flashback-*-sbom.*.json.sig \
            flashback-*-sbom.*.json.pem \
            --clobber
