name: SBOM
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate + attach SBOM
    runs-on: ubuntu-latest
    # contents: write scoped to the one job that needs it (release upload).
    # Scorecard's Token-Permissions check flags top-level write tokens.
    permissions:
      contents: write
    env:
      # Hoisted out of `run:` interpolation per semgrep's
      # github-actions.security.run-shell-injection rule: github.* context
      # data should land in env first, then be referenced as "$VAR" inside the
      # script so it can't be parsed as shell.
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # syft natively understands Cargo.lock and emits CycloneDX + SPDX
      # from a single binary; faster than `cargo cyclonedx` (no compile).
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: flashback-${{ github.ref_name }}-sbom.cdx.json
          output-file: flashback-${{ github.ref_name }}-sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          artifact-name: flashback-${{ github.ref_name }}-sbom.spdx.json
          output-file: flashback-${{ github.ref_name }}-sbom.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: flashback-*-sbom.*.json

      - name: Attach SBOMs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$REF_NAME" flashback-*-sbom.*.json --clobber
