# Deliberately NOT a pull-request check. A fuzzer finds what it finds when it
# finds it; gating merges on a stochastic run means a dependabot bump sits
# blocked because a scheduled campaign happened to be unlucky. A crash opens as
# a real finding rather than a red X on somebody else's PR.
#
# Weekly, not nightly. These parsers change rarely, and a campaign that has
# already run tens of millions of executions against unchanged code learns
# almost nothing on the 30th identical night — it just adds one more job that
# can go red while nobody is looking. Run it on demand after touching a parser,
# which is when it actually has something new to chew on.
name: Fuzz

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        required: false
        default: '300'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [parse_extraction, parse_distill, strip_fences]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libFuzzer needs the sanitizer runtime, which is nightly-only.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # post-v2.9.2
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || '300' }} \
            -rss_limit_mb=4096

      # A crash is only useful with the input that caused it.
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
