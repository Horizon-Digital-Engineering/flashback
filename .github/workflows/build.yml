name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Postgres + pgvector so #[sqlx::test] tests execute under
    # `cargo llvm-cov`. The coverage tool doesn't distinguish unit from
    # integration; same lcov.info, same Sonar metric.
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: flashback
          POSTGRES_USER: flashback
          POSTGRES_PASSWORD: flashback
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flashback"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgres://flashback:flashback@localhost:5432/flashback
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # Shallow clones disabled for better analysis relevancy

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # post-v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.81.7
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info

      - name: SonarQube Scan
        # The hex string below is a SHA-pinned action commit, not an API key.
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
