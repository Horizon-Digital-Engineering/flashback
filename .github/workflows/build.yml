name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Advisory: code quality/coverage reporting, not a merge gate. An expired
    # SONAR_TOKEN or a SonarCloud outage must not block a green build — the
    # blocking gates are Test, Clippy, Format, and the secret scanners.
    continue-on-error: true
    # Postgres + pgvector so #[sqlx::test] tests execute under
    # `cargo llvm-cov`. The coverage tool doesn't distinguish unit from
    # integration; same lcov.info, same Sonar metric.
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: flashback
          POSTGRES_USER: flashback
          POSTGRES_PASSWORD: flashback
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flashback"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgres://flashback:flashback@localhost:5432/flashback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones disabled for better analysis relevancy

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # post-v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info

      - name: SonarQube Scan
        # The hex string below is a SHA-pinned action commit, not an API key.
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Use the runner's preinstalled JDK instead of auto-provisioning a JRE
          # from the Sonar API — that metadata request returns 403, while the
          # analysis token still authenticates the scan itself.
          args: -Dsonar.scanner.skipJreProvisioning=true
