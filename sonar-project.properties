sonar.projectKey=Horizon-Digital-Engineering_flashback
sonar.organization=horizon-digital-engineering

# Workspace layout: crates live under crates/{server,mcp,nlp}/src.
# Sonar's Rust analyzer auto-detects .rs files under sonar.sources.
sonar.sources=crates
sonar.exclusions=**/target/**,**/node_modules/**

# Coverage produced by `cargo llvm-cov --lcov` in .github/workflows/build.yml.
sonar.rust.lcov.reportPaths=coverage/lcov.info

# Skip docs/migrations from analysis (they're not Rust source).
sonar.test.exclusions=**/target/**
